basePath: /api
definitions:
  customergroup.CustomerGroupCreateRequest:
    properties:
      description:
        type: string
      name:
        maxLength: 100
        type: string
    required:
    - name
    type: object
  customergroup.CustomerGroupUpdateRequest:
    properties:
      description:
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 100
        type: string
    type: object
  pricing.PricingMethod:
    enum:
    - fixed_price
    - discount_percent
    - discount_amount
    - markup_percent
    type: string
    x-enum-varnames:
    - PricingMethodFixedPrice
    - PricingMethodDiscountPct
    - PricingMethodDiscountAmt
    - PricingMethodMarkupPct
  pricing.PricingRule:
    properties:
      allow_combine:
        type: boolean
      brand_id:
        type: integer
      category_id:
        type: integer
      created_at:
        type: string
      customer_group_id:
        type: integer
      effective_from:
        type: string
      effective_until:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      maximum_quantity:
        type: integer
      minimum_quantity:
        type: integer
      name:
        type: string
      pricing_method:
        $ref: '#/definitions/pricing.PricingMethod'
      pricing_type:
        $ref: '#/definitions/pricing.PricingType'
      pricing_value:
        type: number
      priority:
        type: integer
      product_id:
        type: integer
      recurrence_days:
        items:
          type: string
        type: array
      scope_type:
        description: Scope fields populated on read (not stored in pricing_rules)
        type: string
      store_id:
        type: integer
      time_from:
        type: string
      time_to:
        type: string
      updated_at:
        type: string
    type: object
  pricing.PricingType:
    enum:
    - default
    - special_price
    - promotion
    type: string
    x-enum-comments:
      PricingTypeDefault: fallback only — not creatable
    x-enum-descriptions:
    - fallback only — not creatable
    - ""
    - ""
    x-enum-varnames:
    - PricingTypeDefault
    - PricingTypeSpecialPrice
    - PricingTypePromotion
  pricing.ResolveItem:
    properties:
      customer_group_id:
        type: integer
      product_id:
        type: integer
      quantity:
        type: integer
      store_id:
        type: integer
    type: object
  pricing.resolveRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/pricing.ResolveItem'
        minItems: 1
        type: array
    required:
    - items
    type: object
  product.Product:
    properties:
      barcode:
        type: string
      brand_id:
        type: integer
      brand_name:
        type: string
      category_id:
        type: integer
      category_name:
        type: string
      cost:
        type: integer
      created_at:
        type: string
      default_discount_percent:
        type: number
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      price:
        type: integer
      sku:
        type: string
      status:
        type: string
      stock:
        type: integer
      store_id:
        type: integer
      tax_class_id:
        type: integer
      tax_rate:
        type: number
      unit_of_measure:
        type: string
      unit_of_measure_id:
        type: integer
      updated_at:
        type: string
      weight_grams:
        type: integer
    type: object
  store.StoreCreateRequest:
    properties:
      address:
        type: string
      name:
        maxLength: 100
        type: string
      phone:
        type: string
    required:
    - name
    type: object
  store.StoreUpdateRequest:
    properties:
      address:
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 100
        type: string
      phone:
        type: string
    type: object
  supplier.ProductSupplier:
    properties:
      created_at:
        type: string
      id:
        type: integer
      is_preferred:
        type: boolean
      lead_time_days:
        type: integer
      notes:
        type: string
      product_id:
        type: integer
      product_name:
        type: string
      product_sku:
        type: string
      supplier_code:
        type: string
      supplier_id:
        type: integer
      supplier_name:
        description: Joined fields (populated on read with JOIN queries)
        type: string
      supplier_sku:
        type: string
      unit_cost:
        type: integer
      updated_at:
        type: string
    type: object
  supplier.Supplier:
    properties:
      address:
        type: string
      code:
        type: string
      contact_name:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      email:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      notes:
        type: string
      phone:
        type: string
      store_id:
        type: integer
      updated_at:
        type: string
    type: object
  user.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
host: localhost:9095
info:
  contact: {}
  description: REST API for Retail POS System
  title: Retail POS System API
  version: "1.0"
paths:
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Change the authenticated user's password
      parameters:
      - description: Password change payload
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return access token with refresh token cookie
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Login
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange a refresh token for a new access token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Refresh access token
      tags:
      - auth
  /customer-groups:
    get:
      consumes:
      - application/json
      description: Get a paginated list of customer groups
      parameters:
      - default: 20
        description: Page size
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      - description: Search name
        in: query
        name: search
        type: string
      - description: Filter by active status
        in: query
        name: is_active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List customer groups
      tags:
      - Customer Groups
    post:
      consumes:
      - application/json
      description: Create a new customer group
      parameters:
      - description: Customer Group data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/customergroup.CustomerGroupCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a customer group
      tags:
      - Customer Groups
  /customer-groups/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a customer group by ID
      parameters:
      - description: Customer Group ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete a customer group
      tags:
      - Customer Groups
    get:
      consumes:
      - application/json
      description: Get a single customer group by its ID
      parameters:
      - description: Customer Group ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get customer group by ID
      tags:
      - Customer Groups
    put:
      consumes:
      - application/json
      description: Update an existing customer group
      parameters:
      - description: Customer Group ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/customergroup.CustomerGroupUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update a customer group
      tags:
      - Customer Groups
  /dashboard/chart:
    get:
      consumes:
      - application/json
      description: Get daily or hourly sales data for charting. Returns hourly data
        when startDate equals endDate.
      parameters:
      - default: 7 days ago
        description: Start date (YYYY-MM-DD, Jakarta time)
        in: query
        name: startDate
        type: string
      - default: today
        description: End date (YYYY-MM-DD, Jakarta time)
        in: query
        name: endDate
        type: string
      - description: Previous period start date for comparison
        in: query
        name: prevStart
        type: string
      - description: Previous period end date for comparison
        in: query
        name: prevEnd
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get sales chart data
      tags:
      - reports
  /dashboard/comparison:
    get:
      consumes:
      - application/json
      description: Compare revenue, orders, and AOV between current and previous period
      parameters:
      - default: daily
        description: Period type (daily, 7days, weekly, monthly, yearly)
        in: query
        name: period
        type: string
      - default: realtime
        description: Comparison mode (realtime, completed, 30days)
        in: query
        name: mode
        type: string
      - default: today
        description: Reference date (YYYY-MM-DD, Jakarta time)
        in: query
        name: date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get period comparison
      tags:
      - reports
  /dashboard/stats:
    get:
      consumes:
      - application/json
      description: Get today's revenue, sales, total products, and low stock count
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get dashboard statistics
      tags:
      - reports
  /pricing-rules:
    get:
      consumes:
      - application/json
      description: Get a paginated list of pricing rules with optional filters
      parameters:
      - default: 20
        description: Page size
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      - description: Search rule name
        in: query
        name: search
        type: string
      - description: Filter by product ID
        in: query
        name: product_id
        type: integer
      - description: Filter by type (special_price|promotion)
        in: query
        name: pricing_type
        type: string
      - description: Filter by method (fixed_price|discount_percent|discount_amount|markup_percent)
        in: query
        name: pricing_method
        type: string
      - description: Filter by category ID
        in: query
        name: category_id
        type: integer
      - description: Filter by brand ID
        in: query
        name: brand_id
        type: integer
      - description: Filter by customer group ID
        in: query
        name: customer_group_id
        type: integer
      - description: Filter by store ID
        in: query
        name: store_id
        type: integer
      - description: Filter by active status
        in: query
        name: is_active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List pricing rules
      tags:
      - Pricing
    post:
      consumes:
      - application/json
      description: Create a new pricing rule. Requires at least one target (product_id,
        category_id, or brand_id).
      parameters:
      - description: Pricing rule data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pricing.PricingRule'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a pricing rule
      tags:
      - Pricing
  /pricing-rules/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a pricing rule by ID
      parameters:
      - description: Rule ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete a pricing rule
      tags:
      - Pricing
    get:
      consumes:
      - application/json
      description: Get a single pricing rule by its ID
      parameters:
      - description: Rule ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get pricing rule by ID
      tags:
      - Pricing
    put:
      consumes:
      - application/json
      description: Update an existing pricing rule
      parameters:
      - description: Rule ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pricing.PricingRule'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update a pricing rule
      tags:
      - Pricing
  /pricing/resolve:
    post:
      consumes:
      - application/json
      description: Resolve the effective selling price for one or more products given
        context (quantity, customer group, store)
      parameters:
      - description: Items to resolve
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pricing.resolveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Resolve prices for cart items
      tags:
      - Pricing
  /products:
    get:
      consumes:
      - application/json
      description: Get paginated list of products with optional filters
      parameters:
      - default: 50
        description: Limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      - description: Search by name, SKU, or barcode
        in: query
        name: search
        type: string
      - description: Sort field
        in: query
        name: sortBy
        type: string
      - description: Sort direction (asc or desc)
        in: query
        name: sortDir
        type: string
      - description: Filter by category name
        in: query
        name: category
        type: string
      - description: Filter by status (active, inactive)
        in: query
        name: status
        type: string
      - description: Filter by active status (true/false)
        in: query
        name: isActive
        type: string
      - description: Maximum stock threshold
        in: query
        name: maxStock
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List products
      tags:
      - products
    post:
      consumes:
      - application/json
      description: Create a new product with the provided details
      parameters:
      - description: Product payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/product.Product'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a new product
      tags:
      - products
  /products/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a product by ID
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete a product
      tags:
      - products
    put:
      consumes:
      - application/json
      description: Update an existing product by ID
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      - description: Product payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/product.Product'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update a product
      tags:
      - products
  /products/search:
    get:
      consumes:
      - application/json
      description: Search products by name or SKU for the pricing rule form autocomplete
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      - default: 10
        description: Max results (1-50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Search products for pricing autocomplete
      tags:
      - Pricing
  /sales:
    get:
      consumes:
      - application/json
      description: Get paginated list of sales with optional filters
      parameters:
      - default: 50
        description: Limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      - description: Search by invoice number or customer name
        in: query
        name: search
        type: string
      - description: Filter by payment methods (comma-separated codes)
        in: query
        name: payment_methods
        type: string
      - description: Minimum total amount
        in: query
        name: min_total
        type: integer
      - description: Maximum total amount
        in: query
        name: max_total
        type: integer
      - default: created_at
        description: Sort field (created_at, total_amount, invoice_number, payment_method,
          status)
        in: query
        name: sort_by
        type: string
      - default: DESC
        description: Sort direction (ASC or DESC)
        in: query
        name: sort_dir
        type: string
      - description: Start date (YYYY-MM-DD, Jakarta time)
        in: query
        name: start_date
        type: string
      - description: End date (YYYY-MM-DD, Jakarta time)
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get sales history
      tags:
      - sales
    post:
      consumes:
      - application/json
      description: Create a new sale with items. Invoice number is auto-generated
        if omitted.
      parameters:
      - description: Sale payload
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a new sale
      tags:
      - sales
  /sales/{id}:
    get:
      consumes:
      - application/json
      description: Get sale details including items by sale ID
      parameters:
      - description: Sale ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get a sale by ID
      tags:
      - sales
  /sales/export:
    get:
      consumes:
      - application/json
      description: Export sales to CSV or XLSX file
      parameters:
      - default: csv
        description: Export format (csv or xlsx)
        in: query
        name: format
        type: string
      - description: Search by invoice number or customer name
        in: query
        name: search
        type: string
      - description: Filter by payment methods (comma-separated codes)
        in: query
        name: payment_methods
        type: string
      - description: Minimum total amount
        in: query
        name: min_total
        type: integer
      - description: Maximum total amount
        in: query
        name: max_total
        type: integer
      - description: Start date (YYYY-MM-DD, Jakarta time)
        in: query
        name: start_date
        type: string
      - description: End date (YYYY-MM-DD, Jakarta time)
        in: query
        name: end_date
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: Exported file
          schema:
            type: file
      security:
      - BearerAuth: []
      summary: Export sales data
      tags:
      - sales
  /stores:
    get:
      consumes:
      - application/json
      description: Get a paginated list of stores
      parameters:
      - default: 20
        description: Page size
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      - description: Search name
        in: query
        name: search
        type: string
      - description: Filter by active status
        in: query
        name: is_active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
