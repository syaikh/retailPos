version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - revive
    - depguard

  settings:
    depguard:
      # depguard skips blank (_) imports; internal/archtest covers those.
      rules:
        purchase-boundary:
          list-mode: strict
          files:
            - "**/internal/purchase/**"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/gin-gonic/gin
            - github.com/jackc/pgx/v5
            - retail-pos-system/internal/audit
            - retail-pos-system/internal/events
            - retail-pos-system/internal/middleware
            - retail-pos-system/internal/permissions
            - retail-pos-system/internal/shared
        platform-boundary:
          list-mode: strict
          files:
            - "**/internal/platform/**"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/gin-gonic/gin
            - github.com/jackc/pgx/v5
            - github.com/xuri/excelize/v2
            - retail-pos-system/internal/permissions
            - retail-pos-system/internal/platform
            - retail-pos-system/internal/shared
        clean-module-boundary:
          list-mode: strict
          files:
            - "**/internal/brand/**"
            - "**/internal/category/**"
            - "**/internal/customer/**"
            - "**/internal/customergroup/**"
            - "**/internal/inventory/**"
            - "**/internal/pricing/**"
            - "**/internal/product/**"
            - "**/internal/report/**"
            - "**/internal/sale/**"
            - "**/internal/shift/**"
            - "**/internal/stockopname/**"
            - "**/internal/storagelocation/**"
            - "**/internal/store/**"
            - "**/internal/supplier/**"
            - "**/internal/uom/**"
            - "**/internal/user/**"
            - "!**/*_test.go"
          allow:
            - $gostd
            - github.com/gin-gonic/gin
            - github.com/golang-jwt/jwt/v5
            - github.com/google/uuid
            - github.com/jackc/pgx/v5
            - github.com/jackc/pgx/v5/pgconn
            - github.com/xuri/excelize/v2
            - golang.org/x/crypto/bcrypt
            - retail-pos-system/internal/audit
            - retail-pos-system/internal/config
            - retail-pos-system/internal/events
            - retail-pos-system/internal/eventbus
            - retail-pos-system/internal/middleware
            - retail-pos-system/internal/ownership
            - retail-pos-system/internal/permissions
            - retail-pos-system/internal/shared
            - retail-pos-system/pkg/cache

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming

  exclusions:
    rules:
      - linters:
          - revive
        text: "exported (const|var|type|function|method) .* should have comment"
      - linters:
          - revive
        text: "comment on exported (const|var|type|function|method) .* should be of the form"
      - linters:
          - revive
        text: "package comment"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
