name: e2e
on: [push, pull_request]
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: retail_pos
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-
      - uses: actions/setup-go@v4
        with:
          go-version: '1.26'
      - name: Install deps (root + web)
        run: npm ci
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Wait for DB
        run: npx wait-on tcp:5433 --timeout 30000 && echo "postgres:18 ready"
      - name: Migrate DB
        env:
          PGPASSWORD: admin123
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          # 000_squash is baseline (covers 001..030 idempotent); then 031..039
          for f in database/migrations/000_squash.sql database/migrations/03*.sql; do
            echo "Applying $f"
            psql -h localhost -p 5433 -U pos -d retail_pos -f "$f"
          done
          echo "migrations done"
      - name: Start backend
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_USER: pos
          DB_PASSWORD: admin123
          DB_NAME: retail_pos
          JWT_SECRET: ci-test-secret-for-github-actions-only-32b
          ENV: development
          LOGIN_RATE_LIMIT_RPM: "100"
          LOGIN_RATE_LIMIT_BURST: "100"
          RATE_LIMIT_RPS: "100"
          RATE_LIMIT_BURST: "200"
        run: |
          go run cmd/server/main.go &
          for i in $(seq 1 60); do
            curl -sf http://localhost:9095/health && echo "backend ready" && break
            echo "waiting for backend $i/60"
            sleep 2
          done
          curl -sf http://localhost:9095/health
      - name: Start frontend
        working-directory: web
        env:
          VITE_API_BASE_URL: http://localhost:9095
        run: |
          npm run dev -- --host 0.0.0.0 --port 5173 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173/ && echo "frontend ready" && break
            echo "waiting for frontend $i/60"
            sleep 2
          done
      - name: Start print-agent
        run: |
          go run ./tools/print-agent/cmd/print-agent --port 9124 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:9124/health && echo "print-agent ready" && break
            echo "waiting for print-agent $i/30"
            sleep 2
          done
          curl -sf http://localhost:9124/health || echo "print-agent health check skipped (no /health)"
      - name: Run e2e shard ${{ matrix.shard }}/4
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - name: List reports
        if: always()
        run: ls -la playwright-report 2>&1 || ls -la test-results 2>&1 || echo "no report found"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: warn
  merge:
    if: always()
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: reports
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright merge-reports reports --reporter html || npx playwright merge-reports reports/report-* --reporter html || echo "merge failed, listing reports" && ls -R reports | head -50
      - uses: actions/upload-artifact@v4
        with:
          name: all-reports
          path: playwright-report
          if-no-files-found: warn
