name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "24"
  GOLANGCI_LINT_VERSION: "v2.13.2"
  GOVULNCHECK_VERSION: "v1.1.4"
  TEST_DB_HOST: localhost
  TEST_DB_PORT: 5432
  TEST_DB_USER: pos
  TEST_DB_PASSWORD: testpassword
  TEST_DB_NAME: retail_pos_test
  JWT_SECRET: ci-test-secret-9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a
  # Defined rather than left to fall back to JWT_SECRET, so the separate
  # refresh-token signing key is actually exercised.
  JWT_SECRET_REFRESH: ci-test-refresh-1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f809

jobs:
  # ── Go Static Analysis ─────────────────────────────────────
  go-fmt:
    name: "Go: Format"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Check gofmt
        run: |
          diff=$(gofmt -s -d .)
          if [ -n "$diff" ]; then
            echo "$diff"
            echo ""
            echo "Run 'gofmt -s -w .' to fix formatting."
            exit 1
          fi

  go-vet:
    name: "Go: Vet"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go vet ./...

  go-build:
    name: "Go: Build"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build ./...

  go-test:
    name: "Go: Tests"
    runs-on: ubuntu-latest
    needs: go-build
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: retail_pos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Wait for postgres
        run: until pg_isready -h localhost -p 5432; do sleep 1; done
      - name: Run tests with race detector
        run: go test -race -p 1 -count=1 -timeout 300s $(go list ./... | grep -v cmd/server)

  go-lint:
    name: "Go: Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  # ── Go Security ─────────────────────────────────────────────
  govulncheck:
    name: "Go: Vulnerability Check"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      - name: Run govulncheck
        run: |
          set +e
          OUTPUT=$(govulncheck ./... 2>&1)
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 0 ]; then
            echo "No vulnerabilities found"
            exit 0
          fi

          # GO-2026-6452: excelize v2.11.0 already contains the fix (commit 93f0b3ca)
          # but the Go vuln DB entry is incomplete (missing "fixed" event in semver range).
          # Remove this filter once the vuln DB is corrected.
          KNOWN_FP="GO-2026-6452"

          VULN_IDS=$(echo "$OUTPUT" | grep -oP "GO-\d{4}-\d+" | sort -u || true)
          REAL_VULNS=""
          for vid in $VULN_IDS; do
            if [ "$vid" != "$KNOWN_FP" ]; then
              REAL_VULNS="$REAL_VULNS $vid"
            fi
          done

          if [ -n "$REAL_VULNS" ]; then
            echo "::error::Real vulnerabilities found:$REAL_VULNS"
            echo "$OUTPUT"
            exit 1
          fi

          echo "No real vulnerabilities found (GO-2026-6452 is a known false positive: excelize v2.11.0 is patched)"

  # ── Frontend ────────────────────────────────────────────────
  frontend-format:
    name: "Frontend: Format"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Check formatting (prettier)
        working-directory: web
        run: npx prettier --check "src/**/*.{ts,svelte,js,json,css}"

  frontend-lint:
    name: "Frontend: Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint

  frontend-typecheck:
    name: "Frontend: Type Check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Type check
        working-directory: web
        run: npm run check

  frontend-test:
    name: "Frontend: Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Run tests
        working-directory: web
        run: npm run test:run

  frontend-build:
    name: "Frontend: Build"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        run: npm run build

  # ── Integration ─────────────────────────────────────────────
  integration:
    name: "Integration: Build & Migrate"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [go-build, frontend-build]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: retail_pos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Wait for postgres
        run: until pg_isready -h localhost -p 5432; do sleep 1; done
      - name: Build backend
        run: go build -o /tmp/server ./cmd/server/main.go
      - name: Apply migrations
        env:
          PGPASSWORD: testpassword
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          psql -h localhost -p 5432 -U pos -d retail_pos_test -v ON_ERROR_STOP=1 -c "CREATE TABLE IF NOT EXISTS schema_migrations (filename TEXT PRIMARY KEY)"
          for f in database/migrations/*.sql; do
            echo "Applying $f"
            psql -h localhost -p 5432 -U pos -d retail_pos_test -v ON_ERROR_STOP=1 -f "$f"
          done
          echo "Migrations complete"
      - name: Verify server starts
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: pos
          DB_PASSWORD: testpassword
          DB_NAME: retail_pos_test
          JWT_SECRET: ${{ env.JWT_SECRET }}
        run: |
          /tmp/server &
          for i in $(seq 1 30); do
            curl -sf http://localhost:9095/health && echo "Backend healthy" && break
            echo "Waiting for backend $i/30"
            sleep 2
          done
          curl -sf http://localhost:9095/health
      # The steps above run with every setting defaulted, which is how the dev
      # server is meant to start. The two below pin the production values that
      # deploy/podman-deploy.sh and deploy/docker-compose.yml set, so a change
      # that breaks a production-only path fails here rather than on a host.
      # DB_SSLMODE=disable is required because the CI postgres service ships
      # without TLS, same as postgres:18-alpine.
      - name: Verify server starts in production mode
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: pos
          DB_PASSWORD: testpassword
          DB_NAME: retail_pos_test
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_SECRET_REFRESH: ${{ env.JWT_SECRET_REFRESH }}
          ENV: production
          LOG_LEVEL: info
          CORS_ORIGIN: https://pos.example.com
          COOKIE_SECURE: "true"
          DB_SSLMODE: disable
          PORT: "8080"
        run: |
          set -euo pipefail
          /tmp/server > /tmp/prod-server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "Backend healthy in production mode"
              break
            fi
            if ! kill -0 $pid 2>/dev/null; then
              echo "::error::server exited during production boot"
              cat /tmp/prod-server.log
              exit 1
            fi
            echo "Waiting for backend $i/30"
            sleep 2
          done
          curl -sf http://localhost:8080/health > /dev/null
          # ENV=production must select slog.JSONHandler, not the development text
          # handler. A regression here leaks request paths and IPs into a log
          # pipeline that is expected to be structured.
          if ! head -1 /tmp/prod-server.log | jq -e '.level' > /dev/null; then
            echo "::error::expected JSON logs in production, got:"
            head -1 /tmp/prod-server.log
            exit 1
          fi
          echo "Production JSON logging confirmed"
      - name: Verify production fails fast without database TLS
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: pos
          DB_PASSWORD: testpassword
          DB_NAME: retail_pos_test
          JWT_SECRET: ${{ env.JWT_SECRET }}
          # DB_SSLMODE deliberately omitted: production defaults to require.
          ENV: production
          PORT: "8080"
        run: |
          set -uo pipefail
          # The CI postgres has ssl=off. Production must refuse the connection
          # rather than silently downgrading, otherwise a host that forgets to
          # mount certificates gets a crash loop with no explanation.
          if /tmp/server > /tmp/tls-server.log 2>&1; then
            echo "::error::server started against a TLS-less database in production; expected a non-zero exit"
            exit 1
          fi
          if ! grep -qi 'TLS' /tmp/tls-server.log; then
            echo "::error::expected a TLS-related error, got:"
            cat /tmp/tls-server.log
            exit 1
          fi
          echo "Production correctly refused the TLS-less database:"
          grep -i 'TLS' /tmp/tls-server.log | head -3
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Verify frontend build
        run: test -d web/dist && echo "Frontend build artifacts present"

  # ── Security ────────────────────────────────────────────────
  codeql:
    name: "Security: CodeQL"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
