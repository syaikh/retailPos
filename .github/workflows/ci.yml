name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "24"
  GOLANGCI_LINT_VERSION: "v2.13.2"
  GOVULNCHECK_VERSION: "v1.1.4"
  TEST_DB_HOST: localhost
  TEST_DB_PORT: 5432
  TEST_DB_USER: pos
  TEST_DB_PASSWORD: testpassword
  TEST_DB_NAME: retail_pos_test
  JWT_SECRET: ci-test-secret-9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a

jobs:
  # ── Go Static Analysis ─────────────────────────────────────
  go-fmt:
    name: "Go: Format"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Check gofmt
        run: |
          diff=$(gofmt -s -d .)
          if [ -n "$diff" ]; then
            echo "$diff"
            echo ""
            echo "Run 'gofmt -s -w .' to fix formatting."
            exit 1
          fi

  go-vet:
    name: "Go: Vet"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go vet ./...

  go-build:
    name: "Go: Build"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build ./...

  go-test:
    name: "Go: Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: retail_pos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Wait for postgres
        run: until pg_isready -h localhost -p 5432; do sleep 1; done
      - name: Run tests with race detector
        run: go test -race -p 1 -count=1 -timeout 300s $(go list ./... | grep -v cmd/server)

  go-lint:
    name: "Go: Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v7
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  # ── Go Security ─────────────────────────────────────────────
  govulncheck:
    name: "Go: Vulnerability Check"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      - name: Run govulncheck
        run: govulncheck ./...

  # ── Frontend ────────────────────────────────────────────────
  frontend-format:
    name: "Frontend: Format"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Check formatting (prettier)
        working-directory: web
        run: npx prettier --check "src/**/*.{ts,svelte,js,json,css}"

  frontend-lint:
    name: "Frontend: Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint

  frontend-typecheck:
    name: "Frontend: Type Check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Type check
        working-directory: web
        run: npm run check

  frontend-test:
    name: "Frontend: Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Run tests
        working-directory: web
        run: npm run test:run

  frontend-build:
    name: "Frontend: Build"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        run: npm run build

  # ── Integration ─────────────────────────────────────────────
  integration:
    name: "Integration: Build & Migrate"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [go-build, frontend-build]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: retail_pos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Wait for postgres
        run: until pg_isready -h localhost -p 5432; do sleep 1; done
      - name: Build backend
        run: go build -o /tmp/server ./cmd/server/main.go
      - name: Apply migrations
        env:
          PGPASSWORD: testpassword
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          psql -h localhost -p 5432 -U pos -d retail_pos_test -c "CREATE TABLE IF NOT EXISTS schema_migrations (filename TEXT PRIMARY KEY)"
          for f in database/migrations/*.sql; do
            echo "Applying $f"
            psql -h localhost -p 5432 -U pos -d retail_pos_test -f "$f"
          done
          echo "Migrations complete"
      - name: Verify server starts
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: pos
          DB_PASSWORD: testpassword
          DB_NAME: retail_pos_test
          JWT_SECRET: ${{ env.JWT_SECRET }}
        run: |
          /tmp/server &
          for i in $(seq 1 30); do
            curl -sf http://localhost:9095/health && echo "Backend healthy" && break
            echo "Waiting for backend $i/30"
            sleep 2
          done
          curl -sf http://localhost:9095/health
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Verify frontend build
        run: test -d web/dist && echo "Frontend build artifacts present"

  # ── Security ────────────────────────────────────────────────
  codeql:
    name: "Security: CodeQL"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
