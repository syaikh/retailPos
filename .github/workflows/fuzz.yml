name: Fuzz (Scheduled)

on:
  schedule:
    - cron: '0 2 * * 1' # Mondays 02:00 UTC
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@v6
      - name: Enumerate fuzz targets
        id: list
        run: |
          set -euo pipefail
          python3 scripts/list_fuzz_targets.py > /tmp/fuzz-targets.json
          jq . /tmp/fuzz-targets.json
          if [ "$(jq 'length' /tmp/fuzz-targets.json)" -eq 0 ]; then
            echo "::error::no Fuzz* targets found — add one or delete this workflow"
            exit 1
          fi
          echo "targets=$(jq -c . /tmp/fuzz-targets.json)" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.targets) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module == '.' && 'go.mod' || format('{0}/go.mod', matrix.module) }}
          cache-dependency-path: ${{ matrix.module == '.' && 'go.sum' || format('{0}/go.sum', matrix.module) }}
      - name: "Fuzz ${{ matrix.target }} (${{ matrix.pkg }})"
        run: |
          go -C "${{ matrix.module }}" test \
            -run='^${{ matrix.target }}$' \
            -fuzz='^${{ matrix.target }}$' \
            -fuzztime 5m \
            ${{ matrix.pkg }}
