name: Fuzz (Scheduled)

on:
  schedule:
    - cron: '0 2 * * 1' # Mondays 02:00 UTC
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - ./internal/pricing/...
          - ./internal/shared/...
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run fuzz tests (limited time)
        run: |
          set -euo pipefail
          pkg="${{ matrix.pkg }}"
          targets=$(go test -list '^Fuzz' "$pkg" | grep '^Fuzz' || true)
          if [ -z "$targets" ]; then
            echo "::error::no Fuzz* targets in $pkg — add one or drop this package from the matrix"
            exit 1
          fi
          for t in $targets; do
            echo "== Fuzzing $pkg $t"
            go test -fuzz="^${t}\$" -fuzztime 5m "$pkg"
          done
